<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StuPlan - {{ t.homework_add_title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="main-header"><h1>StuPlan</h1><p>{{ t.homework_add_title }}</p></header>
    <main class="container schedule-container">
        <a href="/homework" class="back-link">← {{ t.homework_title }}</a>
        <section class="card schedule-card">
            <h2>📝 {{ t.homework_add_title }}</h2>
            <form method="POST" class="add-form">
                <label>{{ t.subject }}</label>
                <input type="text" name="subject" placeholder="{{ t.subject_placeholder }}" required>
                <label>{{ t.task }}</label>
                <input type="text" name="task" placeholder="{{ t.task_placeholder }}" required>
                <label>{{ t.deadline }}</label>
                <input type="date" name="deadline" required>
                <button type="submit">{{ t.add }}</button>
            </form>
        </section>
    </main>
    <footer class="main-footer"><p>&copy; 2026 StuPlan</p></footer>
</body>
</html>
