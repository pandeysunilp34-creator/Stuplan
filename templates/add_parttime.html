<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StuPlan - {{ t.parttime_add_title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="main-header"><h1>StuPlan</h1><p>{{ t.parttime_add_title }}</p></header>
    <main class="container schedule-container">
        <a href="/parttime" class="back-link">← {{ t.parttime_title }}</a>
        <section class="card schedule-card">
            <h2>💼 {{ t.parttime_add_title }}</h2>
            <form method="POST" class="add-form">
                <label>{{ t.date }}</label>
                <input type="date" name="date" id="pt_date" required>
                <label>{{ t.start }}</label>
                <input type="time" name="start" required>
                <label>{{ t.end }}</label>
                <input type="time" name="end" required>
                <label>{{ t.place }}</label>
                <input type="text" name="place" placeholder="{{ t.place_placeholder }}" required>
                <button type="submit">{{ t.add }}</button>
            </form>
        </section>
    </main>
    <footer class="main-footer"><p>&copy; 2026 StuPlan</p></footer>
    <script>
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth()+1).padStart(2,'0');
        const dd = String(today.getDate()).padStart(2,'0');
        document.getElementById('pt_date').value = yyyy+'-'+mm+'-'+dd;
    </script>
</body>
</html>
