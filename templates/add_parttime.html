<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StuPlan - {{ t.parttime_add_title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="main-header"><h1>StuPlan</h1><p>{{ t.parttime_add_title }}</p></header>
    <main class="container schedule-container">
        <a href="/parttime" class="back-link">← {{ t.parttime_title }}</a>
        <section class="card schedule-card">
            <h2>💼 {{ t.parttime_add_title }}</h2>
            <form method="POST" class="add-form">
                <label>{{ t.date }}</label>
                <input type="text" name="date" placeholder="{{ t.date_placeholder }}" required>
                <label>{{ t.start }}</label>
                <input type="text" name="start" placeholder="{{ t.start_placeholder }}" required>
                <label>{{ t.end }}</label>
                <input type="text" name="end" placeholder="{{ t.end_placeholder }}" required>
                <label>{{ t.place }}</label>
                <input type="text" name="place" placeholder="{{ t.place_placeholder }}" required>
                <button type="submit">{{ t.add }}</button>
            </form>
        </section>
    </main>
    <footer class="main-footer"><p>&copy; 2026 StuPlan</p></footer>
</body>
</html>
