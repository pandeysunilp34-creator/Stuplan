<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StuPlan - {{ t.schedule_edit_title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="main-header"><h1>StuPlan</h1><p>{{ t.schedule_edit_title }}</p></header>
    <main class="container schedule-container">
        <a href="/schedule" class="back-link">← {{ t.schedule_title }}</a>
        <section class="card schedule-card">
            <h2>📅 {{ t.schedule_edit_title }}</h2>
            <form method="POST" class="add-form">
                <label>{{ t.time }}</label>
                <input type="text" name="time" value="{{ item.time }}" required>
                <label>{{ t.title_label }}</label>
                <input type="text" name="title" value="{{ item.title }}" required>
                <label>{{ t.place }}</label>
                <input type="text" name="place" value="{{ item.place }}" required>
                <button type="submit">{{ t.save }}</button>
            </form>
        </section>
    </main>
    <footer class="main-footer"><p>&copy; 2026 StuPlan</p></footer>
</body>
</html>
