<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StuPlan - {{ t.parttime_edit_title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="main-header"><h1>StuPlan</h1><p>{{ t.parttime_edit_title }}</p></header>
    <main class="container schedule-container">
        <a href="/parttime" class="back-link">← {{ t.parttime_title }}</a>
        <section class="card schedule-card">
            <h2>💼 {{ t.parttime_edit_title }}</h2>
            <form method="POST" class="add-form">
                <label>{{ t.date }}</label>
                <input type="text" name="date" value="{{ item.date }}" required>
                <label>{{ t.start }}</label>
                <input type="text" name="start" value="{{ item.start }}" required>
                <label>{{ t.end }}</label>
                <input type="text" name="end" value="{{ item.end }}" required>
                <label>{{ t.place }}</label>
                <input type="text" name="place" value="{{ item.place }}" required>
                <button type="submit">{{ t.save }}</button>
            </form>
        </section>
    </main>
    <footer class="main-footer"><p>&copy; 2026 StuPlan</p></footer>
    <nav class="bottom-nav">
        <a href="/home" class="nav-item "><span class="nav-icon">🏠</span><span>Home</span></a>
        <a href="/schedule" class="nav-item "><span class="nav-icon">📅</span><span>Schedule</span></a>
        <a href="/homework" class="nav-item "><span class="nav-icon">📝</span><span>Homework</span></a>
        <a href="/parttime" class="nav-item active"><span class="nav-icon">💼</span><span>Part-time</span></a>
        <a href="/dashboard" class="nav-item "><span class="nav-icon">📊</span><span>Dashboard</span></a>
    </nav>
</body>
</html>
